services:
  - type: web
    name: Irmandade-Conhecimento-com-Luz
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Voz neural da narração (ElevenLabs). Preencher no painel do Render.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
    staticPublishPath: public
