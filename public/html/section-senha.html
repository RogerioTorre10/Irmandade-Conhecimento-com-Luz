<link rel="stylesheet" href="/assets/css/styles-base.css">
<link rel="stylesheet" href="/assets/css/brilho-texturas.css">
<link rel="stylesheet" href="/assets/css/j-panel-glow.css">
<link rel="stylesheet" href="/assets/css/styles-senha.css">

<section id="section-senha" class="section j-screen-vert" data-section="senha">
  <div class="j-panel-glow senha-panel">
    <div class="j-perg-v-inner">
      <div class="j-arcane-card senha-wrap">
        <div class="conteudo-pergaminho senha-panel-inner senha-2fa-mode">

          <h2 class="titulo-pergaminho senha-title"
              id="senha-instr1"
              data-typing="true"
              data-cursor="true"
              data-speed="50"
              data-i18n="senha.title"
              data-i18n-text="senha.title"
              data-text="Digite sua Senha">
          </h2>

          <p id="senha-instr2"
             class="senha-copy parchment-text-rough"
             data-typing="true"
             data-cursor="true"
             data-speed="50"
             data-i18n="senha.p1"
             data-i18n-text="senha.p1"
             data-text="Use a senha recebida após a confirmação da compra.">
          </p>

          <p id="senha-instr3"
             class="senha-copy parchment-text-rough"
             data-typing="true"
             data-cursor="true"
             data-speed="50"
             data-i18n="senha.p2"
             data-i18n-text="senha.p2"
             data-text="Informe o mesmo e-mail utilizado na compra.">
          </p>

          <p id="senha-instr4"
             class="senha-copy parchment-text-rough"
             data-typing="true"
             data-cursor="true"
             data-speed="50"
             data-i18n="senha.p3"
             data-i18n-text="senha.p3"
             data-text="A senha e o e-mail serão validados juntos para liberar sua Jornada.">
          </p>          

          <div class="senha-copy-mini senha-email-purpose"
               id="senha-email-identificacao-ajuda"
               data-i18n="senha.purchaseEmailHelp"
               data-i18n-text="senha.purchaseEmailHelp"
               data-text="Este e-mail identifica sua compra e vincula esta Jornada ao seu acesso.">
            Este e-mail identifica sua compra e vincula esta Jornada ao seu acesso.
          </div>

          <div class="senha-input-wrap senha-email-row on-pergaminho">
            <input id="senha-email"
                   class="input-espinhos input-email"
                   type="email"
                   placeholder="Digite seu e-mail..."
                   autocomplete="email"
                   data-i18n-placeholder="senha.emailPurchasePlaceholder"
                   aria-describedby="senha-email-identificacao-ajuda"
                   aria-label="Digite o e-mail usado na compra" />
          </div>

          <div class="senha-input-wrap senha-code-row on-pergaminho">
            <input id="senha-input"
                   name="jornada_codigo_acesso"
                   class="input-espinhos input-senha"
                   type="text"
                   maxlength="18"
                   autocomplete="one-time-code"
                   autocorrect="off"
                   autocapitalize="characters"
                   spellcheck="false"
                   data-lpignore="true"
                   data-1p-ignore="true"
                   placeholder="Digite a senha JCL-XXXX-XXXX-XXXX"
                   data-i18n-placeholder="senha.accessCodePlaceholder"
                   aria-label="Digite a senha recebida após a compra"/>
            
            <button class="btn btn-toggle-senha"
                    data-action="toggle-password"
                    type="button"
                    aria-label="Mostrar ou ocultar a senha">
              👁️
            </button>
          </div>

          <div class="senha-divider">
            <span>◈</span>
          </div>

          <div class="senha-reenvio-wrap">
            <div class="senha-copy-mini"
                 id="senha-reenvio-ajuda"
                 data-i18n="senha.resendEmailHelp"
                 data-i18n-text="senha.resendEmailHelp"
                 data-text="Use este segundo e-mail somente para receber novamente o código válido. Ele é preenchido automaticamente, mas você pode corrigi-lo antes de reenviar.">
              Use este segundo e-mail somente para receber novamente o código válido. Ele é preenchido automaticamente, mas você pode corrigi-lo antes de reenviar.
            </div>

            <div class="senha-input-wrap senha-email-reenvio-row on-pergaminho">
              <input id="senha-email-reenvio"
                     class="input-espinhos input-email"
                     type="email"
                     placeholder="E-mail que receberá novamente o código..."
                     autocomplete="email"
                     data-i18n-placeholder="senha.resendEmailPlaceholder"
                     aria-label="E-mail para reenvio do código" />
            </div>

            <button id="btn-reenviar-2fa"
                    class="btn btn-stone senha-btn-wide"
                    type="button"
                    data-i18n="senha.resendPassword"
                    data-i18n-text="senha.resendPassword"
                    data-text="Reenviar minha senha">
              🔁 Reenviar minha senha
            </button>
          </div>

          <div class="senha-actions">
            <button id="btn-senha-prev"
                    class="btn btn-stone"
                    data-i18n="common.back"
                    data-i18n-text="common.back"
                    data-text="Voltar"
                    aria-label="Voltar">
              😢 Voltar
            </button>

          <button id="btn-senha-avancar"
                  class="btn btn-stone"
                  type="button"
                  data-i18n="senha.enter"
                  data-i18n-text="senha.enter"
                  data-text="Entrar na Jornada"
                  data-next-section="section-guia"
                  aria-label="Validar senha e entrar">
            🔐 Entrar
          </button>
        </div>
        </div>

         <div id="guia-error" class="guia-error" style="display:none;">
            Não foi possível validar o código.
          </div>        
      </div>
    </div>
  </div>
</section>
