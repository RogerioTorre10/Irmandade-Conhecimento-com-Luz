<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sala da Equipe — Irmandade</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#080b11;--p:#101722;--line:rgba(232,198,112,.20);--gold:#e8c670;--text:#f5f0e5;--muted:#a6afbd;--claude:#d9895b;--gpt:#5fc3a0;--bad:#f18484}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,rgba(232,198,112,.08),transparent 33%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}.hidden{display:none!important}
.card{background:linear-gradient(180deg,rgba(16,23,34,.98),rgba(10,15,23,.98));border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid var(--line);background:#141c29;color:var(--text);padding:9px 13px;border-radius:11px;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(#e0bc61,#ad8736);color:#171108;font-weight:800;border:0}.btn.ghost{background:transparent}
.field{width:100%;background:#080d14;border:1px solid rgba(255,255,255,.10);color:var(--text);padding:11px 12px;border-radius:11px;outline:none}.field:focus{border-color:rgba(232,198,112,.5)}
.login{max-width:560px;margin:12vh auto;padding:24px}.login h2{margin:0 0 6px}.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:9px}.status{min-height:20px;margin-top:10px;font-size:12px;color:var(--bad)}
/* layout */
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
.lado{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(8,12,18,.6)}
.lado header{padding:16px 14px 10px}.lado h1{font-size:17px;margin:0;display:flex;gap:8px;align-items:center}
.lado .nova{margin:4px 14px 10px}.lista{overflow:auto;flex:1;padding:0 8px 10px}
.conv{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px;border-radius:10px;cursor:pointer;font-size:13px}
.conv:hover,.conv.ativa{background:rgba(232,198,112,.10)}.conv small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.lado footer{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.topo{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topo .tit{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{display:none}
.fala{flex:1;overflow:auto;padding:16px}
.vazio{max-width:620px;margin:10vh auto;text-align:center;color:var(--muted);line-height:1.6}.vazio b{color:var(--text);font-size:20px;display:block;margin-bottom:6px}
.eu{max-width:880px;margin:18px auto 10px;background:rgba(232,198,112,.10);border:1px solid rgba(232,198,112,.25);border-radius:14px;padding:11px 14px;white-space:pre-wrap;line-height:1.5}
.eu .q{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
.par{max-width:1280px;margin:0 auto 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ia{border-radius:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.08);background:#0d131c;line-height:1.55;font-size:14px;min-width:0;overflow-wrap:anywhere}
.ia .q{font-size:11px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}.ia .q small{font-weight:400;color:var(--muted)}
.ia.claude{border-top:3px solid var(--claude)}.ia.claude .q{color:var(--claude)}
.ia.chatgpt{border-top:3px solid var(--gpt)}.ia.chatgpt .q{color:var(--gpt)}
.ia.erro{opacity:.8}.ia.erro .txt{color:var(--bad)}
.ia .txt p{margin:0 0 8px}.ia .txt ul,.ia .txt ol{margin:0 0 8px;padding-left:20px}.ia .txt h4{margin:8px 0 4px;font-size:14px}
.ia .txt code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:12.5px}
.ia .copiar{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px;padding:0}
.rotulo{max-width:1280px;margin:10px auto 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pensando .txt{color:var(--muted)}.pensando .txt::after{content:"…";animation:pisca 1s infinite}@keyframes pisca{50%{opacity:.2}}
.acoes{max-width:1280px;margin:6px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.compor{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.compor .row{max-width:1280px;margin:0 auto;align-items:flex-end}
.compor textarea{resize:none;min-width:0;min-height:48px;max-height:200px}
.dica{max-width:1280px;margin:6px auto 0;font-size:11px;color:var(--muted)}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.lado{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:transform .2s;background:#0a0f17}
  .lado.aberto{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}.menu{display:inline-block}
  .par{grid-template-columns:1fr}.fala{padding:12px}
}
</style>
</head>
<body>
<section id="login" class="card login">
  <h2>🕯️ Sala da Equipe</h2>
  <p class="sub">Você, o Claude e o ChatGPT na mesma conversa. Use a chave do Painel da Irmandade.</p>
  <div class="row"><input id="secret" class="field" type="password" placeholder="Chave administrativa"><button id="entrar" class="btn primary">Entrar</button></div>
  <div id="loginStatus" class="status"></div>
</section>

<div id="app" class="app hidden">
  <aside id="lado" class="lado">
    <header><h1>🕯️ Sala da Equipe</h1><div class="sub">Rogério · Claude · ChatGPT</div></header>
    <button id="nova" class="btn nova">＋ Nova conversa</button>
    <div id="lista" class="lista"></div>
    <footer id="info"></footer>
  </aside>
  <main class="main">
    <div class="topo"><button id="menu" class="btn ghost menu" aria-label="Conversas">☰</button><div id="titulo" class="tit">Nova conversa</div><button id="sair" class="btn ghost">Sair</button></div>
    <div id="fala" class="fala"></div>
    <div class="compor">
      <div class="row"><textarea id="texto" class="field" rows="2" placeholder="Escreva para os dois…"></textarea><button id="enviar" class="btn primary">Enviar</button></div>
      <div class="dica">Enter envia · Shift+Enter quebra a linha · Depois que os dois responderem, use “Debater” para um comentar a resposta do outro.</div>
    </div>
  </main>
</div>
<script src="/assets/js/sala-equipe.js"></script>
</body>
</html>
